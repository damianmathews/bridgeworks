<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card · Bridgeworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .og {
    width: 1200px;
    height: 630px;
    background: #0A0B0D;
    color: #F5F6F8;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px 56px;
    box-sizing: border-box;
  }

  /* Ambient glows */
  .og-glow-a {
    position: absolute; inset: 0; z-index: -2;
    background: radial-gradient(ellipse 80% 70% at 75% 25%, rgba(232,220,185,0.18), transparent 65%);
    filter: blur(40px);
  }
  .og-glow-b {
    position: absolute; inset: 0; z-index: -2;
    background: radial-gradient(ellipse 60% 60% at 20% 80%, rgba(180,211,192,0.10), transparent 65%);
    filter: blur(50px);
  }

  /* Subtle grid */
  .og-mesh {
    position: absolute; inset: 0; z-index: -1;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 80px 80px;
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black, transparent 90%);
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black, transparent 90%);
  }

  /* SVG particle constellation */
  .og-stars { position: absolute; inset: 0; z-index: -1; opacity: 0.55; }

  /* Top row */
  .og-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .og-brand {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 8px 18px 8px 14px;
    background: rgba(15, 17, 22, 0.55);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 999px;
    box-shadow: 0 12px 48px -16px rgba(0, 0, 0, 0.5);
  }
  .og-brand svg { width: 26px; height: 22px; color: #F5F6F8; }
  .og-brand-name {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.018em;
    line-height: 1;
  }

  .og-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255,255,255,0.025);
    backdrop-filter: blur(20px);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #B6BAC2;
  }
  .og-eyebrow-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #C8E0D2;
    box-shadow: 0 0 14px rgba(180,211,192,0.6);
  }

  /* Middle: massive headline */
  .og-mid {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-top: -8px;
  }
  .og-headline {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 104px;
    line-height: 1.04;
    letter-spacing: -0.032em;
    margin: 0 0 24px;
    font-variation-settings: "opsz" 144;
  }
  .og-headline-line { display: block; padding-bottom: 0.04em; }
  .og-headline-line:nth-child(2) {
    font-style: italic;
    font-weight: 300;
    background: linear-gradient(180deg, #F5F6F8 0%, #B6BAC2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    padding-bottom: 0.14em;
  }
  .og-sub {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.5;
    color: #B6BAC2;
    max-width: 800px;
    letter-spacing: -0.005em;
  }

  /* Bottom row */
  .og-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 32px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .og-tags {
    display: flex;
    gap: 12px;
  }
  .og-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #C8E0D2;
    padding: 7px 16px;
    border: 1px solid rgba(180,211,192,0.40);
    border-radius: 999px;
    background: rgba(180,211,192,0.06);
  }
  .og-domain {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    letter-spacing: 0.16em;
    color: #B6BAC2;
    text-transform: uppercase;
  }
  .og-domain .accent { color: #C8E0D2; }
</style>
</head>
<body>
<!-- 1200×630 social card. Take a screenshot of this card, save as assets/og-image.png. -->
<div class="og" id="og-card">
  <div class="og-glow-a"></div>
  <div class="og-glow-b"></div>
  <div class="og-mesh"></div>
  <svg class="og-stars" viewBox="0 0 1200 630" preserveAspectRatio="none">
    <g fill="#F5F6F8">
      <circle cx="120" cy="180" r="1.2"/>
      <circle cx="280" cy="100" r="0.8"/>
      <circle cx="500" cy="160" r="1"/>
      <circle cx="780" cy="80" r="0.9"/>
      <circle cx="980" cy="200" r="1.1"/>
      <circle cx="1080" cy="380" r="0.9"/>
      <circle cx="160" cy="420" r="1"/>
      <circle cx="900" cy="540" r="1.2"/>
      <circle cx="640" cy="540" r="0.8"/>
      <circle cx="380" cy="540" r="1"/>
      <circle cx="60" cy="320" r="0.7"/>
      <circle cx="1140" cy="130" r="0.7"/>
    </g>
    <g stroke="rgba(180,211,192,0.16)" stroke-width="0.5" fill="none">
      <line x1="120" y1="180" x2="280" y2="100"/>
      <line x1="280" y1="100" x2="500" y2="160"/>
      <line x1="500" y1="160" x2="780" y2="80"/>
      <line x1="780" y1="80" x2="980" y2="200"/>
      <line x1="980" y1="200" x2="1080" y2="380"/>
      <line x1="160" y1="420" x2="380" y2="540"/>
      <line x1="380" y1="540" x2="640" y2="540"/>
      <line x1="640" y1="540" x2="900" y2="540"/>
    </g>
  </svg>

  <div class="og-top">
    <div class="og-brand">
      <svg viewBox="0 0 32 26" fill="none">
        <path d="M2 20 Q16 4 30 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <line x1="2" y1="22" x2="30" y2="22" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <line x1="9" y1="14" x2="9" y2="22" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="16" y1="9" x2="16" y2="22" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="23" y1="14" x2="23" y2="22" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span class="og-brand-name">Bridgeworks</span>
    </div>
    <div class="og-eyebrow">
      <span class="og-eyebrow-dot"></span>
      AI for asset management
    </div>
  </div>

  <div class="og-mid">
    <h1 class="og-headline">
      <span class="og-headline-line">AI agents for the</span>
      <span class="og-headline-line">asset management cycle.</span>
    </h1>
    <p class="og-sub">Sourcing, diligence, valuation, monitoring, LP reporting. Humans on every judgment call.</p>
  </div>

  <div class="og-bottom">
    <div class="og-tags">
      <span class="og-tag">Sourcing</span>
      <span class="og-tag">Diligence</span>
      <span class="og-tag">Valuation</span>
      <span class="og-tag">Monitoring</span>
      <span class="og-tag">LP reporting</span>
    </div>
    <div class="og-domain">Book a diagnostic <span class="accent">↗</span></div>
  </div>
</div>
</body>
</html>
